[package]
name = "wrmd"
version = "0.1.2"
description = "A lightweight, high-performance Typora-style Markdown editor"
authors = ["WRMD Team"]
edition = "2021"

[lib]
name = "wrmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
